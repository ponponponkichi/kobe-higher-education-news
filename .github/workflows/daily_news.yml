name: Daily higher education news update

on:
  schedule:
    # GitHub ActionsのcronはUTC。23:00 UTCは翌日の08:00 JST。
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect news and build public feed
        run: python 03_scripts/collect_news.py --allow-partial

      - name: Commit public feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_output/public_news.json
          if git diff --cached --quiet; then
            echo "No public feed changes."
          else
            git commit -m "Update public news feed"
            git push
          fi
