name: Security and regression tests

on:
  schedule:
    # GitHub ActionsのcronはUTC。月曜00:00 UTCは月曜09:00 JST。
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "requirements.txt"
      - "03_scripts/**/*.py"
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "03_scripts/**/*.py"
      - ".github/workflows/security.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run regression tests
        working-directory: 03_scripts
        run: python -m unittest discover -s tests -v
