name: Test daily email digest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Send last 24 hours as a test email
        env:
          DIGEST_GMAIL_ADDRESS: ${{ secrets.DIGEST_GMAIL_ADDRESS }}
          DIGEST_GMAIL_APP_PASSWORD: ${{ secrets.DIGEST_GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: >-
          python 03_scripts/send_daily_digest.py
          --state "${RUNNER_TEMP}/email_digest_test_state.json"
